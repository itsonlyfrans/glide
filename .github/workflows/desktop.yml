name: Glide desktop
# Builds the Tauri app with its engine for Windows (x64) and Apple Silicon Macs.
#  - Manual run, or a push to main that touches the app or engine: builds both (not notarized) and uploads the
#    installers as workflow artifacts. Main builds also keep the Rust build cache warm for releases.
#  - Tag push vX.Y.Z: also publishes a GitHub release with the installers, the signed update files and latest.json,
#    which installed copies of Glide check for updates.
# Secrets: TAURI_SIGNING_PRIVATE_KEY (update signing; required), and for signed + notarized Mac builds CSC_LINK
# (Developer ID .p12, base64), CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["core/**", "desktop/**", ".github/workflows/desktop.yml"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, artifact: glide-windows-x64 }
          - { os: macos-latest, triple: aarch64-apple-darwin, artifact: glide-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Latest stable Rust
        shell: bash
        run: |
          rustup update stable && rustup default stable && rustc --version
          echo "RUSTC_VERSION=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_ENV"
      # Compiled dependencies survive between runs (tag builds can only use caches saved on main).
      - name: Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/glide-target
            ${{ runner.temp }}/desktop-target
          key: desktop-${{ matrix.triple }}-rust${{ env.RUSTC_VERSION }}-${{ hashFiles('core/Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-${{ matrix.triple }}-rust${{ env.RUSTC_VERSION }}-
      - name: Build and stage the engine
        shell: bash
        env:
          GLIDE_CARGO_TARGET: ${{ matrix.triple }}
          GLIDE_TARGET_DIR: ${{ runner.temp }}/glide-target
        run: node desktop/scripts/stage-engine.js
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Signing certificate (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then echo "No certificate: the Mac build will not be signed."; exit 0; fi
          # Our own temporary keychain with its own random password.
          KEYCHAIN="$RUNNER_TEMP/glide-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/glide-devid.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/glide-devid.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/glide-devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          echo "Signing as: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Installer window background (macOS)
        if: runner.os == 'macOS'
        # One TIFF holding the normal and Retina pictures, so the install window is sharp on every Mac.
        run: tiffutil -cathidpicheck desktop/src-tauri/dmg/background.png desktop/src-tauri/dmg/background@2x.png -out desktop/src-tauri/dmg/background.tiff
      - name: Build the app
        shell: bash
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/desktop-target
        run: |
          # Notarize only release builds, and only when the Apple details are present.
          if [ -z "$APPLE_ID" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          # The build cache keeps the target folder: never let an older version's installers ride along.
          rm -rf "$CARGO_TARGET_DIR/${{ matrix.triple }}/release/bundle"
          pnpm exec tauri build --target ${{ matrix.triple }}
      - name: Collect installers
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          B="$RUNNER_TEMP/desktop-target/${{ matrix.triple }}/release/bundle"
          find "$B" -maxdepth 2 \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp {} "$OUT" \;
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write latest.json for the updater
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          cd dist
          # Only this version's files, and exactly one of each, or the release stops here.
          WIN=$(ls *_"$VERSION"_*-setup.exe)
          MAC=$(ls *.app.tar.gz)
          [ "$(echo "$WIN" | wc -l)" = 1 ] && [ "$(echo "$MAC" | wc -l)" = 1 ] && [ -f "$WIN.sig" ] && [ -f "$MAC.sig" ] || { echo "unexpected installer files:"; ls; exit 1; }
          ls | grep -E '_[0-9]+\.[0-9]+\.[0-9]+_' | grep -v "_${VERSION}_" && { echo "files from another version"; exit 1; } || true
          python3 - "$VERSION" "$TAG" "$REPO" "$WIN" "$MAC" <<'PY'
          import json, sys, datetime, urllib.parse
          version, tag, repo, win, mac = sys.argv[1:6]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          sig = lambda f: open(f + ".sig").read().strip()
          json.dump({
              "version": version,
              "notes": f"Glide {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {"signature": sig(win), "url": base + urllib.parse.quote(win)},
                  "darwin-aarch64": {"signature": sig(mac), "url": base + urllib.parse.quote(mac)},
              },
          }, open("latest.json", "w"), indent=2)
          PY
          cat latest.json
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Glide ${TAG#v}" --notes "See the changelog for what is new." dist/*
