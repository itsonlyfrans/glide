[package]
name = "glide-desktop"
version = "0.2.26"
description = "The Glide window: pairs computers, arranges screens and controls the always-on Glide engine."
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "glide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
gethostname = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-autostart = "2.7.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
