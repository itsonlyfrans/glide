<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src ipc: http://ipc.localhost; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="shell">
    <aside class="rail" aria-label="Main">
      <div class="brand drag">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="9" width="12" height="11" rx="2.5" fill="var(--win)"/>
          <rect x="17" y="12" width="12" height="11" rx="2.5" fill="var(--mac)"/>
          <circle cx="16" cy="16" r="3.4" fill="var(--bg)"/><circle cx="16" cy="16" r="2.2" fill="var(--cursor)"/>
        </svg>
        <span class="brand-name">Glide</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="rail-foot" id="railFoot"></div>
    </aside>
    <main class="stage">
      <header class="topbar drag">
        <h1 id="viewTitle">Desk</h1>
        <div class="topbar-right no-drag" id="topbarRight"></div>
      </header>
      <div id="banner"></div>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="js/bridge.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
