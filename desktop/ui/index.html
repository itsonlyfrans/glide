<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src ipc: http://ipc.localhost; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="shell">
    <aside class="rail" aria-label="Main">
      <div class="brand drag">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="brandFill" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5fb0ff"/><stop offset="1" stop-color="#a98bff"/></linearGradient></defs>
          <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#brandFill)"/>
          <path d="M13 27.5h10M9.5 34.5h12M14 41.5h8" stroke="#fff" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
          <path d="M28 14v32l8-7.4 5.2 11.9 5.9-2.6-5.2-11.7h10.9z" fill="#fff" stroke="#1b1f33" stroke-opacity=".22" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">Glide</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="rail-foot" id="railFoot"></div>
    </aside>
    <main class="stage">
      <header class="topbar drag">
        <h1 id="viewTitle">Desk</h1>
        <div class="topbar-right no-drag" id="topbarRight"></div>
      </header>
      <div id="banner"></div>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="js/bridge.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
