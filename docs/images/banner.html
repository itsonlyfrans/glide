<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glide banner</title>
<style>
  @font-face { font-family: Bricolage; src: url("../../desktop/ui/fonts/bricolage-grotesque-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: Instrument; src: url("../../desktop/ui/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; }
  :root { --bg: #161a24; --win: #62b6ff; --mac: #b8a2ff; --cursor: #ffc857; --ink: #e9ecf5; --ink2: #9aa3ba; }
  html, body { margin: 0; width: 1280px; height: 640px; background: var(--bg); overflow: hidden; }
  body { font-family: Instrument, system-ui, sans-serif; color: var(--ink); position: relative; }
  .glow { position: absolute; inset: 0; background:
      radial-gradient(600px 360px at 78% 58%, rgba(98, 182, 255, .14), transparent 70%),
      radial-gradient(520px 340px at 96% 40%, rgba(184, 162, 255, .16), transparent 70%); }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.2px); background-size: 26px 26px; }
  .text { position: absolute; left: 88px; top: 170px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 72px; height: 72px; filter: drop-shadow(0 8px 22px rgba(95, 140, 255, .35)); }
  h1 { font: 700 84px/1 Bricolage, sans-serif; letter-spacing: -0.03em; margin: 0; }
  p { font-size: 27px; line-height: 1.4; color: var(--ink2); margin: 28px 0 0; }
  p b { color: var(--ink); font-weight: 600; }
  .chips { margin-top: 34px; display: flex; gap: 12px; }
  .chip { font-size: 17px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: var(--ink); }
  .desk { position: absolute; left: 700px; top: 150px; width: 520px; height: 340px; }
  .scr { position: absolute; border-radius: 12px; border: 2px solid; display: grid; place-items: center; font: 600 19px/1.2 Instrument, sans-serif; }
  .pc { left: 0; top: 112px; width: 300px; height: 168px; border-color: var(--win); background: linear-gradient(160deg, #23324b, #1b2232); box-shadow: 0 0 0 5px rgba(98,182,255,.12), 0 18px 40px rgba(0,0,0,.45); }
  .pc2 { left: 40px; top: 20px; width: 220px; height: 88px; border-color: var(--win); background: linear-gradient(160deg, #23324b, #1b2232); opacity: .85; }
  .mac { left: 306px; top: 140px; width: 190px; height: 124px; border-color: var(--mac); background: linear-gradient(160deg, #2c2846, #1d1d2e); box-shadow: 0 0 0 5px rgba(184,162,255,.14), 0 18px 40px rgba(0,0,0,.45); }
  .seam { position: absolute; left: 301px; top: 146px; width: 4px; height: 112px; background: #fff; opacity: .85; border-radius: 3px; box-shadow: 0 0 14px rgba(255,255,255,.6); }
  .trail { position: absolute; left: 0; top: 0; width: 520px; height: 340px; }
  .cursor { position: absolute; left: 432px; top: 244px; width: 30px; height: 30px; }
  .label { color: var(--ink2); font-size: 15px; font-weight: 500; display: block; margin-top: 4px; text-align: center; }
</style>
</head>
<body>
  <div class="glow"></div><div class="dots"></div>
  <div class="text">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="bf" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5fb0ff"/><stop offset="1" stop-color="#a98bff"/></linearGradient></defs>
        <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bf)"/>
        <path d="M13 27.5h10M9.5 34.5h12M14 41.5h8" stroke="#fff" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
        <path d="M28 14v32l8-7.4 5.2 11.9 5.9-2.6-5.2-11.7h10.9z" fill="#fff" stroke="#1b1f33" stroke-opacity=".16" stroke-width="1" stroke-linejoin="round"/>
      </svg>
      <h1>Glide</h1>
    </div>
    <p><b>One keyboard, mouse and clipboard</b> for your Mac and Windows computers. Move the cursor across, copy on one, paste on the other.</p>
    <div class="chips"><span class="chip">Encrypted end to end</span><span class="chip">Mac + Windows</span><span class="chip">Open source</span></div>
  </div>
  <div class="desk">
    <div class="scr pc2"></div>
    <div class="scr pc"><div>Studio PC<span class="label">Windows</span></div></div>
    <div class="scr mac"><div>MacBook Pro<span class="label">macOS</span></div></div>
    <div class="seam"></div>
    <svg class="trail" viewBox="0 0 520 340"><path d="M190 262 Q 310 222 436 252" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10" opacity=".9"/></svg>
    <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.5L16 20l-3 1.5-3.5-7.5L4 18z" fill="#fff" stroke="#161a24" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
</body>
</html>
